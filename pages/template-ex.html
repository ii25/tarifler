<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarif Sitesi</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="icon" href="../images/favicon.ico" type="image/x-icon" />
</head>

<body>
  <!-- FULL WIDTH HEADER -->
  <header class="header">
    <div class="container header-inner">
      <div class="header-left">

        <!-- Logo -->
        <div class="logo" onclick="window.location.href='../index.html';" style="cursor:pointer;">
          <img src="../images/icon-logo.svg" class="logo-icon">
          <span class="logo-text1">tarif<span class="logo-text2">sitesi<span class="logo-text3">.com</span></span></span>
        </div>
        <!-- Logo. -->
      </div>
      <!-- Tarif Başlığı -->
      <div class="recipe-title-container-single">
        <div class="recipe-title-line-single">
          <span></span>
          <h1>TARİF BAŞLIĞI</h1>
          <span></span>
        </div>
      </div>
      <!--
      <div class="recipe-title-container-double">
      <div class="recipe-title-line-double">
      <span></span>
      <h1>TARİF BAŞLIĞI</h1>
      <span></span>
      </div>
      <p class="recipe-title-sub-text">BAŞLIK ALT AÇIKLAMASI</p>
      </div>
      -->
      <!-- Tarif Başlığı. -->
      <div class="header-right">
        <!-- Arama Kutusu -->
        <div class="search-container"><input type="text" id="searchInput" class="mainLoginInput" placeholder="&#61442;"
            oninput="search()" />
          <div id="results" class="results-dropdown"></div>
        </div>
        <!-- Arama Kutusu. -->
      </div>
    </div>
  </header>
  <!-- FULL WIDTH HEADER. -->
  <!-- Görsel yüksekliği: style.css içindeki --gorsel-yukseklik. Sadece bu sayfa için: <div class="recipe-image" style="--gorsel-yukseklik: 260px"> -->
  <div class="recipe-image"><img src="../images/food.png" alt=""></div>
  <!-- İçerik -->
  <div class="container">
    <!-- Malzemeler Kartı -->
    <div class="card">
      <div class="card-header">
        <div class="icon-text-mal">
          <img src="../images/icon-mal.svg" class="icon-mal">
          <span class="text-mal">Malzemeler</span>
        </div>
      </div>
      <div class="table-container">
        <table class="malzeme-tablosu">
          <tbody id="malzemeBody"></tbody>
        </table>
      </div>
    </div>
    <!-- Malzemeler Kartı -->
    <!-- Tarif Kartı -->
    <div class="card">
      <div class="card-header">
        <div class="icon-text-haz">
          <img src="../images/icon-haz.svg" alt="" class="icon-haz">
          <span class="text-haz">Hazırlanışı</span>
        </div>
      </div>
      <div class="info-note"><span class="puf-isareti"></span> renkli yazılar püf noktalarını belirtir.</div>
      <div class="table-container">
        <section class="recipe">
          <!-- Genel Bakış: adımlardan önce gelir -->
          <div class="genel-bakis">
            <h3>Genel Bakış</h3>
            <p>...</p>
          </div>
          <!-- Genel Bakış. -->
          <ol class="steps">
            <li>
              <div class="step-content">
                <strong>Ön Hazırlık</strong>
                <ul>
                  <li>...</li>
                </ul>
              </div>
            </li>
            <li>
              <div class="step-content">
                <strong>Adım</strong>
                <ul>
                  <li><span class="puf">...</span></li>
                </ul>
              </div>
            </li>
            <li>
              <div class="step-content">
                <strong>Servis</strong>
                <ul>
                  <li>...</li>
                </ul>
              </div>
            </li>
          </ol>
          <!-- Bilgi Notları: son adımdan sonra gelir -->
          <div class="bilgi-notlari">
            <h3>Bilgi Notları</h3>
            <div class="not-grubu">
              <h4>Saklama</h4>
              <ul>
                <li>...</li>
              </ul>
            </div>
            <div class="not-grubu">
              <h4>Besin Öğesi Korunumu</h4>
              <ul>
                <li>...</li>
              </ul>
            </div>
          </div>
          <!-- Bilgi Notları. -->
        </section>
      </div>
    </div>
  </div>
  <!-- Icerik -->
  <!-- JavaScript -->
  <!-- Ortak kod: ../recipe.js (satır fonksiyonları ve hesaplama) -->
  <script src="../recipe.js"></script>
  <script>
    // Malzeme Satırları (her tarifte burası değişir)
    addInfoRow("Tüm malzemelerde doğal ve taze olanları tercih ediniz.");
    addMainRow("Ana Malzeme", "...");
    addNormalRow("Normal Malzeme", 0, "...");
    addCustomRow("Özel Malzeme", "...");
    addDropdownRow(
      [
        { label: "Seçenekli Malzeme", value: 1, aciklama: "Seçenekli Malzeme Açıklamaları" },
        { label: "Seçenekli Malzeme1", value: 2, aciklama: "Seçenekli Malzeme1 Açıklamaları" },
        { label: "Seçenekli Malzeme2", value: 3, aciklama: "Seçenekli Malzeme2 Açıklamaları" },
        { label: "Seçenekli Malzeme3", value: 4, aciklama: "Seçenekli Malzeme3 Açıklamaları" }
      ],
      "Genel açıklama (seçeneğin kendi açıklaması yoksa bu görünür)",
      "Değiştir" // düğme yazısı (isteğe bağlı)
    );
    // Malzeme Satırları.
  </script>
  <script src="../script.js" defer></script>
  <!-- JavaScript. -->
</body>

</html>
